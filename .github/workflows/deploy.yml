name: Deploy to VPS

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd /var/www/dojangms-prod
              git pull origin main
              npm install
              pm2 restart dojangms-prod
            else
              cd /var/www/dojangms-staging
              git pull origin develop
              npm install
              pm2 restart dojangms-staging
            fi
